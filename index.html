<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TTS Mejorado</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 500px;
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin-top: 40px;
}

textarea, button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 5px;
    border: none;
}

button {
    background: #22c55e;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Texto a Voz (Online PRO)</h2>

    <textarea id="texto" placeholder="Escribe aquí..."></textarea>

    <button onclick="generar()">🎧 Generar y Reproducir</button>

    <audio id="audio" controls style="margin-top:10px; width:100%;"></audio>
</div>

<script>
async function generar() {
    let texto = document.getElementById("texto").value;

    let url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=" 
              + encodeURIComponent(texto);

    try {
        let respuesta = await fetch(url);
        let blob = await respuesta.blob();

        let audioURL = URL.createObjectURL(blob);

        let audio = document.getElementById("audio");
        audio.src = audioURL;
        audio.play();

    } catch (error) {
        alert("Error al generar audio 😢");
        console.error(error);
    }
}
</script>

</body>
</html>
