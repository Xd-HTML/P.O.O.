<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TTS Online Básico</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 500px;
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    margin-top: 40px;
}

textarea, button {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 5px;
    border: none;
}

button {
    background: #22c55e;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Texto a Voz (Online)</h2>

    <textarea id="texto" placeholder="Escribe aquí..."></textarea>

    <button onclick="generar()">🎧 Generar Audio</button>

    <audio id="audio" controls style="margin-top:10px; width:100%;"></audio>
</div>

<script>
async function generar() {
    let texto = document.getElementById("texto").value;

    let url = "https://api.streamelements.com/kappa/v2/speech?voice=es-ES-AlvaroNeural&text=" + encodeURIComponent(texto);

    let audio = document.getElementById("audio");
    audio.src = url;

    // descarga automática
    let a = document.createElement("a");
    a.href = url;
    a.download = "audio.mp3";
    a.click();
}
</script>

</body>
</html>
